<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Emannuel Márdyan — desenvolvimento full-stack e produtos SaaS</title>
  <desc id="description">Banner em verde-esmeralda com o nome de Emannuel, formas geométricas e um cursor de terminal animado.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1716"/><stop offset="1" stop-color="#10191d"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#25bd83" stop-opacity=".2"/><stop offset="1" stop-color="#25bd83" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#60e6aa"/><stop offset="1" stop-color="#60e6aa" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6be5b0" stroke-opacity=".035"/></pattern>
    <clipPath id="round"><rect width="960" height="360" rx="24"/></clipPath>
    <style>
      .cursor { animation: blink 1.4s steps(1) infinite; }
      .orbit { transform-origin: 814px 158px; animation: orbit 28s linear infinite; }
      @keyframes blink { 0%, 58%, 100% { opacity: 1; } 59%, 99% { opacity: 0; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .orbit { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="960" height="360" fill="url(#background)"/>
    <rect width="960" height="360" fill="url(#grid)"/>
    <ellipse cx="800" cy="120" rx="280" ry="250" fill="url(#glow)"/>
    <path d="M48 1H912" stroke="url(#line)" stroke-width="2"/>
    <g fill="none" stroke="#75e6ba" stroke-opacity=".16">
      <circle cx="814" cy="158" r="90"/><circle cx="814" cy="158" r="120" stroke-dasharray="2 10"/>
      <path d="M814 70L890 114V202L814 246L738 202V114Z"/>
      <path d="M738 114L814 158L890 114M814 158V246"/>
    </g>
    <g class="orbit"><circle cx="814" cy="38" r="5" fill="#71e6b5"/><circle cx="814" cy="278" r="3" fill="#71e6b5" opacity=".4"/></g>
    <text x="814" y="175" text-anchor="middle" fill="#71e6b5" font-family="Consolas, monospace" font-size="48" font-weight="600">&lt;/&gt;</text>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="52" y="64" font-size="17" font-weight="600" letter-spacing="4" fill="#75e6ba">FULL-STACK · PRODUTOS SAAS</text>
      <text x="48" y="145" font-size="66" font-weight="700" letter-spacing="-2.5" fill="#f0faf5">Emannuel</text>
      <text x="48" y="217" font-size="66" font-weight="700" letter-spacing="-2.5" fill="#75e6ba">Márdyan.</text>
      <text x="52" y="264" font-size="23" fill="#a9c3b9">Interface, código e produto.</text>
      <path d="M52 294H908" stroke="#315347" stroke-opacity=".65"/>
      <text x="52" y="329" font-family="Consolas, monospace" font-size="18" fill="#a9c3b9"><tspan fill="#75e6ba">&gt;</tspan> construindo soluções com propósito</text>
      <rect class="cursor" x="474" y="313" width="9" height="19" rx="1" fill="#75e6ba"/>
      <text x="908" y="329" text-anchor="end" font-size="16" letter-spacing="3" font-weight="600" fill="#75e6ba">NABIO</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="959" height="359" rx="24" fill="none" stroke="#2c463d"/>
</svg>
